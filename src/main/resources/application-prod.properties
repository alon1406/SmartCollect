# =============================================================================
# Production profile - activated with SPRING_PROFILES_ACTIVE=prod,initDemoes
#
# application.properties is left untouched so local development and the course
# submission keep behaving exactly as before. Everything that differs in a
# public deployment is overridden here.
# =============================================================================

# The platform decides the port; 8084 is only a local fallback.
server.port=${PORT:8084}

# In development spring-boot-docker-compose discovers the database by reading
# compose.yaml. That dependency is developmentOnly and is not in the production
# jar, so the connection has to come from the environment instead.
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# The public demo is meant to be disposable: every restart drops the schema and
# initDemoes re-seeds the same fixed dataset, so whatever a visitor changed is
# gone and the demo is always identical.
spring.jpa.hibernate.ddl-auto=create

# ---------------------------------------------------------------------------
# Logging
#
# The development config turns on SQL printing and Hibernate parameter binding
# at TRACE. That writes every bound value - including user passwords - into the
# server log, which on a hosted platform is persisted and searchable.
# ---------------------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.orm.jdbc.bind=off
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=info

# Swagger stays on - for a portfolio deployment the live API docs are a feature.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---------------------------------------------------------------------------
# Public-deployment guards.
#
# Registration is unauthenticated, so a requested ADMIN role is downgraded to
# END_USER. This is only switched on here: POST /users is also the only way to
# create an administrator, and the integration tests rely on it to bootstrap
# the ADMIN they use for cleanup between tests.
#
# A user can still promote itself through PUT /users - the operator dashboard
# depends on that and it cannot simply be closed - so the bulk-delete routes
# are disabled too. That removes what an escalated account could destroy.
# ---------------------------------------------------------------------------
smartcollect.users.allow-admin-registration=false
smartcollect.admin.bulk-delete-enabled=false
