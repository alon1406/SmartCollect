<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCollect | Login</title>
    <meta name="description"
        content="SmartCollect — Smart Waste Collection Management System. Login to access your dashboard.">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=2.9.1">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #12998A 0%, #0D7A6A 32%, #064E42 68%, #08201C 100%);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-y: auto;
        }

        /* Decorative background circles */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.07;
            background: #fff;
        }

        body::before {
            width: 500px;
            height: 500px;
            top: -150px;
            left: -150px;
        }

        body::after {
            width: 400px;
            height: 400px;
            bottom: -100px;
            right: -100px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            z-index: 1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.4s ease;
        }

        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
            gap: 0.75rem;
        }

        .login-logo-icon {
            width: 64px;
            height: 64px;
            background: var(--brand-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(13, 122, 106, 0.4);
        }

        .login-logo h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text);
            margin: 0;
        }

        .login-logo p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin: 0;
        }

        .login-error {
            background: var(--status-red-bg);
            border: 1px solid #FECACA;
            color: #B91C1C;
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap .form-input {
            padding-left: 2.75rem;
        }

        .input-icon-wrap .input-icon {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            border-radius: var(--radius);
            margin-top: 0.5rem;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Dev seed panel */
        .seed-panel {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 1.25rem;
            margin-top: 1.25rem;
            backdrop-filter: blur(8px);
        }

        .seed-panel p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
        }

        .seed-panel .seed-title {
            color: #fff;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-seed {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            padding: 0.6rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-seed:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-seed:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <!-- Login Card -->
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon"><i class="fa-solid fa-leaf"></i></div>
                <h1>SmartCollect</h1>
                <p>Smart Waste Collection Management</p>
            </div>

            <div id="login-error" class="login-error" style="display:none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="login-error-msg">Invalid email or password.</span>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="login-email" class="form-input" placeholder="your@email.com"
                            autocomplete="email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••"
                            autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" id="btn-login" class="btn btn-primary btn-login">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
                </button>
            </form>

            <div class="login-footer">
                SmartCollect &copy; 2026 — Dolphin Team
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/core/config.js?v=2.9.1"></script>
    <script src="js/core/http.js?v=2.9.1"></script>
    <script src="js/core/session.js?v=2.9.1"></script>
    <script src="js/core/ui.js?v=2.9.1"></script>
    <script src="js/services/userService.js?v=2.9.1"></script>
    <script src="js/services/objectService.js?v=2.9.1"></script>
    <script src="js/services/commandService.js?v=2.9.1"></script>
    <script src="js/pages/app.js?v=2.9.1"></script>
</body>

</html>
